<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיחה בלחיצה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFE15A; --paper: #FFFFFF; --ink: #2B1E4A; --ink-soft: #4A3D6B;
    --red: #F23D2F; --blue: #2E9BFF; --error: #C0261B; --error-bg: #FFE8EC; --hint: #756B92;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--sun) url("assets/bg-dots.svg") repeat;
    color: var(--ink);
    font-family: "Fredoka", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .doodles {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 600px; height: 160px; pointer-events: none;
    background: url("assets/bg-doodles.svg") no-repeat top center / 100% auto;
  }
  main {
    position: relative; max-width: 440px; margin: 0 auto; padding: 18px;
    min-height: 100vh; display: flex; flex-direction: column; gap: 14px;
  }
  .logo { display: block; width: 300px; max-width: 100%; margin: 0 auto; }
  .intro { margin: 0; text-align: center; font-size: 17px; font-weight: 500; color: var(--ink-soft); }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 18px; font-weight: 600; }
  input[type="text"] {
    width: 100%; font: 500 19px "Fredoka", system-ui, sans-serif; color: var(--ink);
    background: var(--paper); border: 3px solid var(--ink); border-radius: 18px;
    padding: 12px 16px; box-shadow: 4px 4px 0 var(--ink); transform: rotate(0.6deg);
  }
  input::placeholder { color: var(--hint); opacity: 1; }
  input:focus { outline: 4px solid var(--blue); outline-offset: 2px; }
  button {
    width: 100%; min-height: 64px; font: 700 24px "Fredoka", system-ui, sans-serif;
    color: #fff; background: var(--red); border: 3px solid var(--ink); border-radius: 999px;
    box-shadow: 0 8px 0 var(--ink); transform: rotate(-1deg); cursor: pointer;
    margin-bottom: 8px; transition: transform .08s, box-shadow .08s;
  }
  button:active, button:disabled {
    transform: translateY(6px) rotate(-1deg); box-shadow: 0 2px 0 var(--ink);
  }
  button:disabled { cursor: default; }
  button:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
  .bubble {
    position: relative; min-height: 190px; background: var(--paper);
    border: 3px solid var(--ink); border-radius: 28px; box-shadow: 6px 6px 0 var(--ink);
    transform: rotate(-1.2deg); padding: 18px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
  }
  .mascot { display: block; width: 118px; height: auto; }
  .msg { margin: 0; font-size: 17px; font-weight: 500; color: var(--ink-soft); }
  .bubble[data-state="think"] .mascot { animation: squash .5s ease-in-out infinite; }
  .bubble[data-state="idle"] .mascot { animation: bounce 2.4s ease-in-out infinite; }
  .bubble[data-state="joke"] { justify-content: flex-start; padding-top: 44px; }
  .bubble[data-state="joke"] .mascot {
    position: absolute; top: -34px; right: -14px; width: 86px;
    transform: rotate(8deg); animation: roll 1.6s ease-in-out 1;
  }
  .bubble[data-state="joke"] .msg {
    font: 500 25px/1.55 "Playpen Sans Hebrew", "Fredoka", system-ui, sans-serif; color: var(--ink);
  }
  .bubble[data-state="error"] { background: var(--error-bg); }
  .bubble[data-state="error"] .msg { color: var(--error); font-weight: 600; }
  .bubble[data-state="error"] .mascot { animation: wobble .8s ease-in-out 1; }
  footer { margin-top: auto; padding-top: 6px; text-align: center; font-size: 13px; color: var(--ink-soft); }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes squash { 0%,100% { transform: scale(1); } 50% { transform: scale(.86); } }
  @keyframes roll { from { transform: rotate(8deg); } to { transform: rotate(1088deg); } }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } 75% { transform: rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="doodles" aria-hidden="true"></div>
<main>
  <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה">
  <p class="intro">כותבים נושא, לוחצים, וצוחקים. בלי נושא, מקבלים בדיחה כללית.</p>
  <form id="form">
    <label for="topic">על מה הבדיחה?</label>
    <input id="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off">
    <button id="btn" type="submit">תנו לי בדיחה!</button>
  </form>
  <div class="bubble" id="bubble" data-state="idle" aria-live="polite">
    <img class="mascot" id="mascot" src="assets/mascot-idle.svg" alt="">
    <p class="msg" id="msg">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
  </div>
  <footer>מיישם AI ואוטומציה · 53500</footer>
</main>
<script>
  const form = document.getElementById("form");
  const topicEl = document.getElementById("topic");
  const btn = document.getElementById("btn");
  const bubble = document.getElementById("bubble");
  const mascot = document.getElementById("mascot");
  const msg = document.getElementById("msg");

  function setState(state, text, label) {
    bubble.dataset.state = state;
    mascot.src = "assets/mascot-" + state + ".svg";
    msg.textContent = text;
    btn.textContent = label;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const topic = topicEl.value.trim();
    btn.disabled = true;
    setState("think", topic ? "מחפש בדיחה על " + topic + "..." : "מחפש בדיחה...", "חושב...");
    try {
      const res = await fetch("/api/joke", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic }),
      });
      const data = await res.json();
      if (!res.ok || !data.joke) throw new Error(data.error || "bad response");
      setState("joke", data.joke, "עוד בדיחה!");
    } catch (err) {
      setState("error", "משהו השתבש. אפשר לנסות שוב.", "לנסות שוב");
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
